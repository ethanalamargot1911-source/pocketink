<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>PocketInk</title>
    <link rel="stylesheet" href="/css/app.css" />

    <!-- "Add to Home Screen" from Safari's share sheet launches this standalone (no address bar,
         no Safari chrome) instead of as a regular browser tab. A plain Safari tab can never go
         fullscreen this way - there's no code-only fix for that, only this manual one-time step. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketInk" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
</head>
<body>
    <video id="mirrorVideo" autoplay muted playsinline hidden></video>
    <div id="surface"></div>
    <div id="remoteCursor" hidden></div>

    <div id="statusBar">
        <span id="statusText">Loading&hellip;</span>
        <span id="latency"></span>
    </div>

    <div id="modeBar">
        <button id="modeDrawButton" type="button" class="mode-button">Draw</button>
        <button id="modeMirrorButton" type="button" class="mode-button">Mirror</button>
        <button id="modeTrackpadButton" type="button" class="mode-button">Trackpad</button>
    </div>
    <div id="modeHint"></div>

    <div id="message" hidden></div>
    <script src="/js/protocol.js"></script>
    <script src="/js/app.js" defer></script>
</body>
</html>
